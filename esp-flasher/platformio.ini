; ESP32-C3 as a Telink TLSR825x SWire (SWS) flasher.
;   c3-usb  : boards whose USB connector goes straight to the C3 (Super Mini, XIAO, DevKitM USB port)
;   c3-uart : boards with a separate USB-UART chip (CH340 / CP2102) on UART0

[platformio]
default_envs = c3-usb

[env]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 460800

[env:c3-usb]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3-uart]
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

; Classic ESP32-WROOM-32 DevKit (Xtensa dual-core) with onboard CH340 USB-UART on UART0.
; Needs Arduino core 3.x / ESP-IDF 5 for the new driver/rmt_tx.h / rmt_rx.h headers.
; The official espressif32 platform still ships Arduino core 2.0.17 (ESP-IDF 4.4, no
; driver/rmt_rx.h), so use the pioarduino platform fork which provides Arduino core 3.x.
[env:esp32]
board = esp32dev
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 460800
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
